<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whiteboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="top-bar">
        <button data-type="hand" class="btn"><img src="assets/hand.svg" alt="Hand SVG"></button>
        <button data-type="pen" class="btn"><img src="assets/pencil-line.svg" alt="Pencil Line SVG"></button>
        <button data-type="line" class="btn"><img src="assets/pencil-line.svg" alt="Pencil Line SVG"></button>
        <button data-type="circle" class="btn"><img src="assets/circle.svg" alt="Circle SVG"></button>
        <button data-type="rectangle" class="btn"><img src="assets/square.svg" alt="Square SVG"></button>
    </div>
    <div class="side-bar"></div>
    <canvas id="canvas"></canvas>
</body>

</html>
